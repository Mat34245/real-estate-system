<table class="table table-striped table-borderless table-hover table-primary">
    <thead>
        <tr>
            <th>Lp</th>
            <th>Miasto</th>
            <th>Cena</th>
        </tr>
    </thead>
    <tbody >
        @for (item of tab; track item.id) {
        <tr>
            <td class="table-dark">{{item.id}}</td>
            <td>{{item.city}}</td>
            <td>{{item.price}}</td>
        </tr>
        }
        </tbody>
    
</table>
